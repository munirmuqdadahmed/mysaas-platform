<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Tajawal', sans-serif; direction: rtl;
            background: #060608; color: #fff; margin: 0; padding: 20px;
        }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding-bottom: 16px; border-bottom: 1px solid #1e1e28; margin-bottom: 20px;
        }
        .header h2 { color: #ffd700; margin: 0; }
        .logout-btn {
            background: #1e1e28; color: #ef4444; border: 1px solid #ef4444;
            padding: 8px 14px; border-radius: 8px; cursor: pointer; font-family: inherit;
        }
        .welcome-card {
            background: #111116; border: 1px solid #1e1e28; border-radius: 14px;
            padding: 24px; text-align: center; max-width: 500px; margin: 40px auto;
        }
        .welcome-card .emoji { font-size: 3rem; margin-bottom: 10px; }
        .trial-badge {
            display: inline-block; background: #1a1608; color: #fbbf24;
            border: 1px solid #fbbf24; padding: 6px 14px; border-radius: 20px;
            font-size: 0.8rem; margin-top: 14px;
        }
        .modules-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px; max-width: 600px; margin: 20px auto;
        }
        .module-card {
            background: #111116; border: 1px solid #1e1e28; border-radius: 12px;
            padding: 20px 10px; text-align: center; opacity: 0.5;
        }
        .module-card .icon { font-size: 1.8rem; margin-bottom: 6px; }
        .module-card .soon { font-size: 0.65rem; color: #888; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="header">
        <h2 id="businessNameHeader">جاري التحميل...</h2>
        <button class="logout-btn" onclick="handleLogout()">
            <i class="fa-solid fa-right-from-bracket"></i> خروج
        </button>
    </div>

    <div class="welcome-card">
        <div class="emoji">🎉</div>
        <h3>الأساس شغّال بنجاح!</h3>
        <p style="color:#aaa;font-size:0.9rem;line-height:1.7;">
            هذا يثبت إن تسجيل الدخول وعزل بيانات عملك عن أي عمل ثاني
            يشتغلون صح 100%. من هنا نبني باقي الوحدات (كاشير، مخزون،
            حضور وانصراف...) فوق نفس هذا الأساس الآمن.
        </p>
        <div id="trialInfo" class="trial-badge"></div>
    </div>

    <div class="modules-grid">
        <div class="module-card"><div class="icon">🧾</div>الكاشير<div class="soon">قريبًا</div></div>
        <div class="module-card"><div class="icon">📦</div>المخزون<div class="soon">قريبًا</div></div>
        <div class="module-card"><div class="icon">👥</div>الموظفين<div class="soon">قريبًا</div></div>
        <div class="module-card"><div class="icon">📊</div>التقارير<div class="soon">قريبًا</div></div>
    </div>

    <script src="saas-core.js"></script>
    <script>
        onAuthReady(async user => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            const businessId = getCurrentBusinessId();
            if (!businessId) {
                window.location.href = 'login.html';
                return;
            }

            try {
                const business = await getCurrentBusinessInfo();
                if (!business) {
                    alert('⚠️ تعذّر إيجاد بيانات هذا العمل.');
                    window.location.href = 'login.html';
                    return;
                }

                document.getElementById('businessNameHeader').innerText =
                    (business.type === 'مطعم' ? '🍔 ' :
                     business.type === 'ماركت' ? '🛒 ' :
                     business.type === 'صالون' ? '💇 ' : '🏪 ') + business.name;

                if (business.plan === 'trial' && business.trialEndsAt) {
                    const daysLeft = Math.max(0, Math.ceil(
                        (business.trialEndsAt - Date.now()) / (24*60*60*1000)
                    ));
                    document.getElementById('trialInfo').innerText =
                        '⏳ باقي على انتهاء التجربة المجانية: ' + daysLeft + ' يوم';
                }
            } catch (err) {
                console.error(err);
                alert('⚠️ صار خطأ بجلب بيانات العمل: ' + err.message);
            }
        });

        function handleLogout() {
            logOut().then(() => window.location.href = 'login.html');
        }
    </script>
</body>
</html>
