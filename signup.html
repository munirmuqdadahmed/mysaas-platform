<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل عمل جديد</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Tajawal', sans-serif; direction: rtl;
            background: #060608; color: #fff; margin: 0;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; padding: 20px;
        }
        .card {
            background: #111116; border: 1px solid #1e1e28; border-radius: 16px;
            padding: 30px 24px; max-width: 400px; width: 100%;
        }
        h1 { text-align: center; color: #ffd700; font-size: 1.4rem; margin-bottom: 6px; }
        p.sub { text-align: center; color: #888; font-size: 0.85rem; margin-bottom: 20px; }
        label { display: block; font-size: 0.8rem; color: #ccc; margin-bottom: 5px; margin-top: 12px; }
        input, select {
            width: 100%; padding: 11px; background: #0d0d11; border: 1px solid #333;
            border-radius: 8px; color: #fff; font-size: 0.95rem; font-family: inherit;
        }
        button {
            width: 100%; margin-top: 22px; padding: 13px; background: #ffd700;
            color: #000; border: none; border-radius: 8px; font-weight: 900;
            font-size: 1rem; cursor: pointer; font-family: inherit;
        }
        button:disabled { opacity: 0.6; }
        .error { color: #ef4444; font-size: 0.82rem; margin-top: 10px; text-align: center; }
        .link { text-align: center; margin-top: 16px; font-size: 0.85rem; }
        .link a { color: #38bdf8; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 ابدأ عملك الجديد</h1>
        <p class="sub">14 يوم تجربة مجانية - بدون بطاقة ائتمان</p>

        <label>نوع العمل:</label>
        <select id="businessType">
            <option value="مطعم">🍔 مطعم / فاست فود</option>
            <option value="ماركت">🛒 ماركت / سوبرماركت</option>
            <option value="صالون">💇 صالون / كوافير</option>
            <option value="أخرى">🏪 نوع آخر</option>
        </select>

        <label>اسم العمل:</label>
        <input type="text" id="businessName" placeholder="مثال: مطعم الأصالة">

        <label>بريدك الإلكتروني:</label>
        <input type="email" id="email" placeholder="you@example.com">

        <label>كلمة المرور:</label>
        <input type="password" id="password" placeholder="6 أحرف على الأقل">

        <button id="submitBtn" onclick="handleSignup()">إنشاء الحساب</button>
        <div id="errorMsg" class="error"></div>

        <div class="link">عندك حساب أصلًا؟ <a href="login.html">سجّل دخولك</a></div>
    </div>

    <script src="saas-core.js"></script>
    <script>
        async function handleSignup() {
            const businessType = document.getElementById('businessType').value;
            const businessName = document.getElementById('businessName').value.trim();
            const email    = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errEl    = document.getElementById('errorMsg');
            const btn      = document.getElementById('submitBtn');
            errEl.innerText = '';

            if (!businessName) return errEl.innerText = '⚠️ أدخل اسم العمل.';
            if (!email)        return errEl.innerText = '⚠️ أدخل بريدك الإلكتروني.';
            if (password.length < 6) return errEl.innerText = '⚠️ كلمة المرور 6 أحرف على الأقل.';

            btn.disabled = true;
            btn.innerText = 'جاري الإنشاء...';

            try {
                await signUpNewBusiness(email, password, businessName, businessType);
                window.location.href = 'dashboard.html';
            } catch (err) {
                btn.disabled = false;
                btn.innerText = 'إنشاء الحساب';
                errEl.innerText = translateAuthError(err.code);
            }
        }

        function translateAuthError(code) {
            const map = {
                'auth/email-already-in-use': '⚠️ هذا البريد مستخدم بحساب موجود أصلًا.',
                'auth/invalid-email':        '⚠️ صيغة البريد الإلكتروني غير صحيحة.',
                'auth/weak-password':        '⚠️ كلمة المرور ضعيفة جدًا.',
            };
            return map[code] || ('⚠️ صار خطأ: ' + code);
        }
    </script>
</body>
</html>
